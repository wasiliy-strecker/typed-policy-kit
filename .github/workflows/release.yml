name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release state
        run: pnpm verify
      - name: Pack public packages
        run: |
          mkdir release-artifacts
          pnpm --filter typed-policy-core pack --pack-destination release-artifacts
          pnpm --filter typed-policy-react pack --pack-destination release-artifacts
          pnpm --filter typed-policy-express pack --pack-destination release-artifacts
          pnpm --filter typed-policy-testkit pack --pack-destination release-artifacts
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: release-artifacts/*.tgz
          generate_release_notes: true
